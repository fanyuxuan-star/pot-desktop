name: Build Windows Installer

# 只做一件事：在 GitHub 的 Windows runner 上打出 NSIS 安装包，不需要本机配 Rust/MSVC，
# 也不需要签名密钥（不产 updater 包）。上游 package.yml 依赖 tag 和 TAURI_PRIVATE_KEY，
# 这里刻意不改它，避免以后合并上游时冲突。

on:
    workflow_dispatch:
    push:
        branches:
            - feat/local-improvements

concurrency:
    group: windows-build-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    build:
        runs-on: windows-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 21

            - name: Install Rust stable (MSVC)
              uses: dtolnay/rust-toolchain@stable

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 9

            - name: Cache cargo
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry/index
                      ~/.cargo/registry/cache
                      ~/.cargo/git/db
                      src-tauri/target
                  key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
                  restore-keys: ${{ runner.os }}-cargo-

            - name: Install dependencies
              run: pnpm install

            - name: Read version
              id: version
              shell: bash
              run: echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

            - name: Build installer (NSIS, x64)
              run: pnpm tauri build -b nsis

            - name: Upload installer
              uses: actions/upload-artifact@v4
              with:
                  name: pot_${{ steps.version.outputs.VERSION }}_windows_x64
                  path: src-tauri/target/release/bundle/nsis/*setup*.exe
                  if-no-files-found: error
